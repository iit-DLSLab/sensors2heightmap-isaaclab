[workspace]
name = "sensors2heightmap_deploy_env"
platforms = ["linux-64"]
channels = ["conda-forge"]

[feature.common.dependencies]
pip = "*"
python = "*"
numpy = "*"
tqdm = "*"
# to build dls2_interface
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"

[feature.common.pypi-dependencies]
# the reconstructor runs on the CPU
torch = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

[feature.common.activation]
scripts = ["activate_ros2_ws.sh"]

[feature.common.activation.env]
ROS_LOCALHOST_ONLY = "1"

[feature.common.tasks]
build = { cmd = "colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF", cwd = "../ros2_ws" }

[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-librealsense2 = "*"
ros-humble-realsense2-camera-msgs = "*"
ros-humble-realsense2-camera = "*"

[feature.lyrical]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
ros-lyrical-librealsense2 = "*"
ros-lyrical-realsense2-camera-msgs = "*"
ros-lyrical-realsense2-camera = "*"

[environments]
humble = ["common", "humble"]
lyrical = ["common", "lyrical"]
